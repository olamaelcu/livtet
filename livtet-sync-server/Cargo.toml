[package]
name = "livtet-sync-server"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[lints]
workspace = true

[lib]
name = "livtet_sync_server"
path = "src/lib.rs"

[[bin]]
name = "livtet-sync-server"
path = "src/main.rs"
[dependencies]
livtet-iroh = { workspace = true }
livtet-sync = { workspace = true }
livtet-sync-iroh = { workspace = true }
livtet-mdns = { workspace = true }
livtet-data = { workspace = true }
livtet-types = { workspace = true }
livtet-rendezvous = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
  "io-std",
  "net",
  "process",
  "signal",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }
camino = { workspace = true }
fs-err = { workspace = true }
base64 = { workspace = true }
mdns-sd = "0.21"
keyring = "4"
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "process",
  "io-util",
  "io-std",
] }
fs-err = { workspace = true }
httpmock = "0.7"
