[package]
name = "livtet-test-utils"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Sync fixtures: temp databases with business + client migrations, seeded
# data, and a `SyncEngine` per simulated device.
sync = ["dep:livtet-data", "dep:livtet-sync"]
# CLI fixtures: a temp-directory database and search index laid out like a
# real install, holding a fixed catalog (see [`cli`]).
cli = [
  "dep:livtet-data",
  "dep:livtet-search",
  "dep:livtet-types",
  "dep:camino",
  "dep:fs-err",
  "dep:serde_json",
]
# Deterministic snapshot settings: insta filters that scrub terminal escapes,
# ULIDs, and temp paths out of rendered output (see [`snapshot`]).
snapshot = ["dep:insta", "dep:regex"]
# Fault injection: make a query, an open, or a bind fail on purpose, so the
# `.map_err` arms become reachable from a test (see [`fault`]).
fault = ["dep:livtet-data", "dep:camino", "dep:fs-err"]

[dependencies]
livtet-data = { workspace = true, features = ["fake"], optional = true }
livtet-search = { workspace = true, optional = true }
livtet-sync = { workspace = true, optional = true }
livtet-types = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
fs-err = { workspace = true, optional = true }
insta = { workspace = true, features = ["filters"], optional = true }
regex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The `fault` module's own tests reserve temp directories to make files
# unreadable and to site a verified-absent path.
camino-tempfile = { workspace = true }
