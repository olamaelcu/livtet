[package]
name = "livtet-sync-iroh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[dependencies]
livtet-iroh = { workspace = true }
livtet-sync = { workspace = true }
livtet-types = { workspace = true }
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "fs", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
