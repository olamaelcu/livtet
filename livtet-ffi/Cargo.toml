[package]
name = "livtet-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
# The FFI surface reaches the whole workspace through `livtet-core`
# alone; `uniffi` forwards the derives on the `types`/`search` surfaces.
livtet-core = { workspace = true, features = ["uniffi"] }
livtet-covers = { workspace = true }
livtet-iroh = { workspace = true }
livtet-sync-iroh = { workspace = true }
livtet-sync = { workspace = true }
livtet-mdns = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
camino.workspace = true
hex.workspace = true
thiserror.workspace = true
serde_json.workspace = true
time.workspace = true

[features]
default = ["seed"]
cli = ["uniffi/cli"]
# `seed` exposes the fake/seed helpers used by the mobile smoke tests.
# Release builds can pass `--no-default-features` to drop the `fake`
# code path from the shipped library.
seed = ["livtet-core/fake"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dev-dependencies]
livtet-core = { workspace = true, features = ["uniffi", "fake"] }
camino-tempfile.workspace = true
fs-err = { workspace = true }
[lints]
workspace = true
