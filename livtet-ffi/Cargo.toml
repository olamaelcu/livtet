[package]
name = "livtet-ffi"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]

[dependencies]
uniffi = "0.32"
uniffi_macros = "0.32"
jni = { version = "0.22", optional = true }
livtet-core = { workspace = true, features = ["fake"] }
livtet-types = { workspace = true }
livtet-database = { workspace = true, features = ["server", "client"] }
livtet-sync = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
once_cell = "1"
miette.workspace = true
tracing = { workspace = true, features = ["log"] }
log = "0.4"
blake3 = "1.8"
hex = { workspace = true }
thiserror.workspace = true
livtet-plugin = { path = "../livtet-plugin" }
livtet-lua-plugins = { path = "../livtet-lua-plugins" }
livtet-lua-stdlib = { path = "../livtet-lua-stdlib" }
ulid = { workspace = true }
toml = { workspace = true }
if-addrs = "0.15"
fs-err.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-logd-logger = { version = "0.5.0", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
], optional = true }

[features]
default = ["android"]
cli = ["uniffi/cli"]
fake = []
android = ["dep:jni", "dep:android-logd-logger"]
ios = ["dep:tracing-oslog"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["cli"]

[dev-dependencies]
livtet-database = { workspace = true, features = ["server", "client"] }
fs-err = { workspace = true }
