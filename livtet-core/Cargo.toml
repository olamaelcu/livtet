[package]
name = "livtet-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[features]
default = ["covers"]
fake = ["livtet-data/fake", "livtet-types/fake"]
covers = ["dep:livtet-covers"]
# Forward the UniFFI derives on the types/search surfaces so a single
# `livtet-core` dependency is enough to generate Kotlin/Swift bindings.
uniffi = ["livtet-types/uniffi", "livtet-search/uniffi"]

[dependencies]
camino = { workspace = true }
dirs = { workspace = true }
livtet-data = { workspace = true }
livtet-iroh = { workspace = true }
livtet-covers = { workspace = true, optional = true }
livtet-search = { workspace = true }
livtet-temporal-quotes = { workspace = true }
livtet-types = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
[lints]
workspace = true
