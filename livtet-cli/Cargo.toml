[package]
name = "livtet-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true


[package.metadata.workspaces]
independent = true

[features]
fake = []

[dependencies]
dirs = "6.0"
livtet-plugin = { workspace = true }
livtet-core = { workspace = true, features = ["fake"] }
livtet-database = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
miette = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "process",
  "io-util",
] }
camino = { workspace = true }
camino-tempfile = { workspace = true }
fs-err = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
inquire = { version = "0.9", features = ["editor"] }
indicatif = { version = "0.18", features = ["tokio"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
camino-tempfile = { workspace = true }
base64 = "0.22"
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
] }
rand = { workspace = true }
minisign = "0.9"
livtet-test-utils = { path = "../livtet-test-utils" }

[[bin]]
name = "livtet-cli"
path = "src/main.rs"
