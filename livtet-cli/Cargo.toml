[package]
name = "livtet-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true


[package.metadata.workspaces]
independent = true

[features]
fake = ["livtet-cli-common/fake"]

[dependencies]
livtet-cli-common = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
camino-tempfile = { workspace = true }

[[bin]]
name = "livtet-cli"
path = "src/main.rs"
