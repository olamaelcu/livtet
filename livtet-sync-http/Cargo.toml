[package]
name = "livtet-sync-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[package.metadata.workspaces]
independent = true

[features]
default = []
reqwest = ["dep:reqwest", "dep:url"]
poem = [
  "dep:poem",
  "dep:http-range",
  "dep:async-stream",
  "dep:futures-util",
  "dep:hex",
  "dep:time",
  "dep:tokio",
  "dep:tracing",
  "dep:livtet-types",
]

[dependencies]
# Base (always compiled; no HTTP library dependencies).
livtet-sync = { workspace = true }
# `livtet-data` is base, not optional: `SyncSession::new` names
# `livtet_data::orm::DatabaseConnection`, so the generic layer needs it.
livtet-data = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# `reqwest` backend.
reqwest = { workspace = true, optional = true, default-features = false, features = [
  "json",
  "http2",
] }
url = { version = "2", optional = true }

# `poem` backend.
poem = { version = "3.1", optional = true, default-features = false, features = [
  "sse",
  "server",
] }
http-range = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }
futures-util = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
  "rt",
  "sync",
  "time",
  "fs",
  "io-util",
] }
tracing = { workspace = true, optional = true }
livtet-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
