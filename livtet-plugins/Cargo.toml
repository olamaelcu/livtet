[package]
name = "livtet-plugins"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true


[package.metadata.workspaces]
independent = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
rmp-serde = { version = "1.3.1" }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tokio = { workspace = true, features = [
  "process",
  "io-util",
  "io-std",
  "sync",
  "rt-multi-thread",
  "macros",
  "rt",
] }
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "serialize", "vendored"] }
camino = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
reqwest = { workspace = true, default-features = false, features = [
  "json",
  "http2",
  "rustls-tls-manual-roots",
] }
ulid = { workspace = true }
specta = { workspace = true }
specta-typescript = "0.0.12"
minisign = "0.9"
ed25519-dalek = { version = "3", features = ["rand_core"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.22"
async-trait = { workspace = true }
hex = "0.4"
rand = { version = "0.10" }
rand_core = { version = "0.10" }
sha2 = "0.11"
hmac = "0.13"
time = { version = "0.3", features = [
  "serde",
  "formatting",
  "parsing",
  "macros",
] }
keyring = "4"
aes-gcm = "0.11"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "aws_lc_rs",
] }
scraper = "0.27"
globset = "0.4"
livtet-core = { workspace = true }
livtet-types = { workspace = true }
livtet-data = { workspace = true }
webpki-roots = "1"
futures-util = "0.3"
which = "8"

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
camino-tempfile = { workspace = true }
serde_json = { workspace = true }
livtet-test-utils = { workspace = true }
miette = { workspace = true }

[[bin]]
name = "livtet-plugins-host-lua"
path = "src/bin/host_lua.rs"
required-features = []
