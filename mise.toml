[tools]
rust = "latest"
"github:corca-ai/nose" = "v0.20.0"
"cargo:cargo-machete" = "0.7"
"cargo:cargo-llvm-cov" = "0.6"
"cargo:cargo-mutants" = "27.1"

[tasks.check-dupes]
description = "Detect new copy-paste duplication (25+ shared lines per occurrence); gates on --fail-on new vs .nose/baseline.json. Smaller duplications are accepted as noise."
run = "nose query . --mode syntax 'shared_lines>25' --baseline .nose/baseline.json --fail-on new --exclude 'target/**' --exclude '.worktrees/**' --format json > check-dupes.json"

[tasks]
cli = "cargo run -p livtet-cli"

[tasks.lint]
description = "Run all lint checks (Rust)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo-machete",
]

[tasks.test]
description = "Run all unit + integration tests (Rust)"
run = ["cargo test --doc --workspace", "cargo test --workspace --all-targets"]

[tasks.coverage]
description = "Measure line/region coverage for the Rust crates (excludes livtet-ffi, livtet-ruby, and test-data scaffolding). HTML report: target/llvm-cov/html/index.html"
run = [
  "cargo llvm-cov --no-report --workspace --all-targets --exclude livtet-ffi --exclude livtet-ruby",
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --summary-only --ignore-filename-regex \"($regex)\"",
]

[tasks."coverage:html"]
depends = ["coverage"]
run = "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --html --ignore-filename-regex \"($regex)\""

[tasks.coverage-clean]
description = "Coverage from a full rebuild. Use this for any number you intend to quote: orphaned objects from deleted or renamed source otherwise linger in target/llvm-cov-target and keep getting reported. `cargo llvm-cov clean` cannot remove them (that dir has no CACHEDIR.TAG, so cargo refuses), hence the rm."
run = ["rm -rf target/llvm-cov-target target/llvm-cov", "mise run coverage"]

[tasks.coverage-check]
description = "Fail when workspace line coverage drops below 90%. The floor is workspace-wide, not per-crate: see the Coverage section in CONTRIBUTING.md for what is excluded and why."
run = [
  "cargo llvm-cov --no-report --workspace --all-targets --exclude livtet-ffi --exclude livtet-ruby",
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --summary-only --fail-under-lines 90 --ignore-filename-regex \"($regex)\"",
]

[tasks.mutants]
description = "Mutation-test livtet-types: injects bugs and checks the suite notices. Coverage says a line ran; this says a test would catch it breaking. Slow. Other crates: cargo mutants -p <crate>"
run = "cargo mutants --no-shuffle -p livtet-types"

[tasks.fuzz]
description = "Run the libFuzzer parser harnesses (fuzz/). Needs a nightly toolchain and cargo-fuzz. Bounded per target by FUZZ_TIME seconds (default 60; set FUZZ_TIME=300 for a longer campaign). Exits non-zero on a crash, which is written to fuzz/artifacts/."
run = [
  "cargo +nightly fuzz run parse_dsl -- -max_total_time=${FUZZ_TIME:-60} -rss_limit_mb=4096",
  "cargo +nightly fuzz run parse_scalars -- -max_total_time=${FUZZ_TIME:-60} -rss_limit_mb=4096",
]
