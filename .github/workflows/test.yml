name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_DATA_DIR=$HOME/.mise" >> "$GITHUB_ENV"
          mise install
          eval "$(mise activate bash)" && echo "PATH=$PATH" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # `mise run test` is the single definition of "the whole suite" —
      # doctests plus every unit and integration target across the
      # workspace. Keeping CI on the task rather than its own `cargo test`
      # invocation means the two cannot drift apart.
      #
      # This compiles `livtet-ruby` as well. That crate has no Rust tests,
      # but it is a workspace member, so `--workspace` links it against
      # libruby via magnus. If a runner image ever ships without Ruby
      # headers, that is what breaks here first.
      - name: Test workspace
        run: mise run test
