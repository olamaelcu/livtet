[workspace]
resolver = "3"
members = [
  "livtet-core",
  "livtet-ffi",
  "livtet-cli",
  "livtet-data",
  "livtet-search",
  "livtet-sync",
  "livtet-types",
  "livtet-covers",
  "livtet-plugins",
  "livtet-plugins-lua",
  "livtet-test-utils",
]
default-members = [
  "livtet-data",
  "livtet-types",
  "livtet-core",
  "livtet-search",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
async-trait = "0.1"
camino = { version = "1", features = ["serde1"] }
camino-tempfile = "1"
fake = { version = "5.1.0", features = ["ulid", "time", "url"] }
fs-err = { version = "3", features = ["tokio"] }
futures-util = "0.3"
hex = "0.4"
jsonschema = { version = "0.49.2" }
livtet-core = { path = "livtet-core" }
livtet-covers = { path = "livtet-covers" }
livtet-data = { path = "livtet-data" }
livtet-plugins = { path = "livtet-plugins" }
livtet-plugins-lua = { path = "livtet-plugins-lua" }
livtet-search = { path = "livtet-search" }
livtet-sync = { path = "livtet-sync" }
livtet-test-utils = { path = "livtet-test-utils" }
livtet-types = { path = "livtet-types" }
miette = "7"
mutants = "0"
paste = "1"
rand = "0.10"
rand_core = "0.10"
reqwest = { version = "0.12", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["camino", "serde_json"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
toml = { version = "1.1.4" }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = { version = "1", features = ["serde", "std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
mem_forget = "deny"
